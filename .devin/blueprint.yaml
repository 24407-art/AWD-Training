# Devin environment blueprint.
# Commands run from the repo root.
initialize: |
  # Node.js 20 for the Angular frontend (Angular 20 requires >= 20.19)
  curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash - && sudo apt-get install -y nodejs
  # Maven for the Spring Boot backend (Java 17 is already installed)
  sudo apt-get install -y maven
  # Maven Central rate-limits this VM (HTTP 429): use the GCS mirror
  mkdir -p ~/.m2 && printf '<settings><mirrors><mirror><id>gcs-central</id><url>https://maven-central.storage-download.googleapis.com/maven2/</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' > ~/.m2/settings.xml
maintenance: |
  (cd frontend && npm install)
